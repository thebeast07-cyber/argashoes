<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argashoes · mockup halaman publik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/*
  Mockup halaman publik Argashoes. Arah visual dari DESIGN.md (kertas, tinta, bata, Archivo, label kardus).
  Design Read: katalog sepatu (HP dulu, lalu desktop) untuk pembeli lokal yang mau cepat cek size dan pesan lewat WhatsApp,
  dial ENERGY 2 / RHYTHM 3 / MOTION 1.
  Alasan tiap keputusan ada di komentar dekat aturannya. Semua isi contoh ditandai di layar.
*/
:root {
  --kertas: #F4F1EA;
  --kertas-gelap: #E9E3D6;   /* alas foto placeholder */
  --tinta: #1D1B18;
  --redup: #5E5A53;
  --bata: #B3361C;           /* satu aksen: aksi utama dan fokus */
  --bata-tekan: #82260F;
  --sedikit-teks: #7A4B00;
  --sedikit-latar: #FBEFD5;
  --habis: #6B6760;
  --putih: #FFFFFF;
  --redup-gelap: #BDB7AB;    /* teks sekunder di atas tinta, 8.61:1 */
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--kertas);
  color: var(--tinta);
  font-family: "Archivo", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--bata); outline-offset: 2px; }
.gelap :focus-visible { outline-color: var(--kertas); }
.angka { font-variant-numeric: tabular-nums; }
.sempit { font-stretch: 75%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/*
  Tiga keadaan layout, dipatok di titik isi mulai tidak pas, bukan daftar ukuran HP:
  < 600px satu kolom (HP), 600-899px kartu 3 kolom dan deret size satu baris,
  >= 900px hero, produk, dan keranjang jadi dua kolom. Isi dibatasi 1200px; latar hero dan footer tetap selebar layar.
*/
:root { --sisi: 16px; --lebar: 1200px; }
@media (min-width: 600px) { :root { --sisi: 24px; } }
@media (min-width: 900px) { :root { --sisi: 40px; } }
.bingkai { min-height: 100vh; background: var(--kertas); position: relative; }

/* Panel mockup di luar desain toko: legenda isi contoh + pindah layar. */
.panel-mockup { padding: 10px 16px 12px; background: var(--putih); border-bottom: 1.5px solid var(--tinta); font-size: 13px; }
.panel-mockup p { margin: 0 0 6px; color: var(--redup); }
.panel-mockup nav { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.panel-mockup a { display: inline-flex; min-height: 44px; align-items: center; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.panel-mockup a[aria-current="page"] { color: var(--bata); }

/* Header toko */
.kepala { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; min-height: 60px; }
.merek { font-stretch: 125%; font-weight: 900; font-size: 22px; letter-spacing: -0.02em; text-decoration: none; display: inline-flex; min-height: 44px; align-items: center; }
.tombol-keranjang { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--tinta); border-radius: 4px; background: var(--putih); font-weight: 700; text-decoration: none; }
.tombol-keranjang:hover { background: var(--kertas-gelap); }
/* Di layar di bawah 360px tulisan "Keranjang" disembunyikan: tanpa ini header luber 10px di 320px. */
@media (max-width: 359px) { .tombol-keranjang .teks { display: none; } }
.tombol-keranjang .jumlah { min-width: 22px; padding: 0 5px; border-radius: 2px; background: var(--tinta); color: var(--kertas); text-align: center; font-size: 13px; line-height: 22px; }
svg.ik { display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: miter; }

/* Tombol umum */
.tombol { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 1.5px solid var(--tinta); border-radius: 4px; background: var(--putih); font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none; }
.tombol:hover { background: var(--kertas-gelap); }
.tombol.utama { background: var(--bata); border-color: var(--bata); color: var(--putih); }
.tombol.utama:hover { background: #9A2E17; border-color: #9A2E17; }
.tombol.utama:active { background: var(--bata-tekan); }
.tombol[disabled] { background: var(--kertas-gelap); border-color: var(--habis); color: var(--redup); cursor: not-allowed; }
.tombol.penuh { width: 100%; }

/* Label size: motif identitas (label ujung kardus). Status selalu tertulis. */
.lbl { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 68px; padding: 6px 4px; border: 1.5px solid var(--tinta); border-radius: 2px; background: var(--putih); cursor: pointer; line-height: 1; }
.lbl .no { font-stretch: 75%; font-weight: 800; font-size: 30px; }
.lbl .st { margin-top: 5px; font-stretch: 75%; font-size: 13px; font-weight: 600; }
.lbl:hover { background: var(--kertas-gelap); }
.lbl.sisa { background: var(--sedikit-latar); border-color: var(--sedikit-teks); color: var(--sedikit-teks); }
.lbl.habis { background: var(--kertas); border-color: rgba(107,103,96,.6); color: var(--habis); }
.lbl.habis .no { text-decoration: line-through; text-decoration-thickness: 3px; }
.lbl[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--kertas); }

/* ---- Beranda ---- */
/* Satu fokus: blok gelap penuh lebar berisi pencari size. Size adalah hambatan terbesar sebelum beli. */
.cari { background: var(--tinta); color: var(--kertas); padding: 28px 16px 24px; }
.cari h1 { margin: 0 0 8px; font-stretch: 112%; font-weight: 900; font-size: clamp(44px, 14vw, 60px); line-height: 0.95; letter-spacing: -0.03em; }
.cari .sub { margin: 0 0 20px; color: var(--redup-gelap); max-width: 30ch; }
.deret-size { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
.cari .lbl { background: transparent; border-color: var(--kertas); color: var(--kertas); min-height: 64px; }
.cari .lbl:hover { background: rgba(244,241,234,.14); }
.cari .lbl[aria-pressed="true"] { background: var(--kertas); color: var(--tinta); }
.cari .hasil { margin: 16px 0 0; min-height: 24px; font-weight: 700; }
.lihat-hasil { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin-top: 12px; padding: 0 16px; border: 1.5px solid var(--kertas); border-radius: 4px; background: var(--kertas); color: var(--tinta); font-weight: 700; text-decoration: none; }

.daftar { padding: 28px 16px 8px; }
.daftar-kepala { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.daftar h2 { margin: 0; font-stretch: 100%; font-weight: 800; font-size: 26px; letter-spacing: -0.01em; }
.merek-pilih { display: flex; gap: 6px; }
.merek-pilih button { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--tinta); border-radius: 4px; background: transparent; font-weight: 700; cursor: pointer; }
.merek-pilih button[aria-pressed="true"] { background: var(--tinta); color: var(--kertas); }

.kartu { display: block; text-decoration: none; background: var(--putih); border: 1px solid rgba(29,27,24,.25); border-radius: 2px; }
.kartu:hover { border-color: var(--tinta); }
.foto { display: flex; align-items: center; justify-content: center; background: var(--kertas-gelap); color: var(--redup); font-stretch: 75%; font-weight: 600; font-size: 14px; text-align: center; padding: 8px; aspect-ratio: 4 / 5; }
.kartu .isi { padding: 10px 10px 12px; }
.merek-kecil { margin: 0; font-stretch: 75%; font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--redup); }
.kartu h3 { margin: 2px 0 6px; font-size: 16px; font-weight: 700; line-height: 1.2; }
.harga { margin: 0; font-weight: 800; font-size: 17px; }
.coret { margin-left: 6px; font-weight: 400; font-size: 14px; color: var(--redup); text-decoration: line-through; }
.grid-kartu .coret { display: block; margin: 0; }
.stok-baris { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; list-style: none; }
.stok-baris li { min-width: 30px; padding: 3px 5px; border: 1.5px solid var(--tinta); border-radius: 2px; text-align: center; font-stretch: 75%; font-weight: 700; font-size: 14px; line-height: 1.1; }
.stok-baris li.sisa { background: var(--sedikit-latar); border-color: var(--sedikit-teks); color: var(--sedikit-teks); }
.stok-baris li.lebih { border-color: transparent; color: var(--redup); }
.status-size { margin: 8px 0 0; font-weight: 700; font-size: 14px; }
.status-size.sisa, .sisa-catatan { color: var(--sedikit-teks); }
.sisa-catatan { margin: 6px 0 0; font-weight: 700; font-size: 13px; }

/* Semua kartu seukuran: belum ada aturan model mana yang ditonjolkan, jadi tidak ada kartu "unggulan". */
.grid-kartu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0; padding: 0; list-style: none; }
/* Kartu dalam satu baris sama tinggi walau ada yang punya harga coret. */
.grid-kartu > li { display: flex; }
.grid-kartu .kartu { flex: 1; }
.kosong { padding: 18px; border: 1.5px solid var(--tinta); border-radius: 2px; background: var(--putih); }
.kosong p { margin: 0 0 12px; }

/* Cara order: halaman sendiri dari footer, bukan bagian dari jalur beli. Empat langkah karena prosesnya memang empat. */
.langkah { margin: 0; padding: 0; list-style: none; }
.langkah li { display: grid; grid-template-columns: 52px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid rgba(29,27,24,.25); }
.langkah .no { display: flex; align-items: center; justify-content: center; height: 52px; border: 1.5px solid var(--tinta); border-radius: 2px; background: var(--putih); font-stretch: 75%; font-weight: 800; font-size: 28px; }
.langkah b { display: block; font-size: 17px; }
.langkah span { color: var(--redup); font-size: 15px; }

.toko { margin-top: 36px; padding: 30px 16px 40px; background: var(--kertas-gelap); }
.toko .ke-cara { display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px; font-weight: 700; text-underline-offset: 3px; }
.toko h2 { margin: 0 0 12px; font-stretch: 100%; font-weight: 800; font-size: 22px; }
.toko dl { margin: 0; }
.toko dt { font-size: 13px; font-weight: 700; color: var(--redup); text-transform: uppercase; font-stretch: 75%; margin-top: 12px; }
.toko dd { margin: 2px 0 0; }
.ph { background: var(--sedikit-latar); color: var(--sedikit-teks); padding: 1px 5px; border-radius: 2px; font-weight: 600; font-size: 14px; }

/* ---- Produk ---- */
.jalan { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; font-weight: 700; text-decoration: none; }
.produk .foto { aspect-ratio: 1 / 1; font-size: 15px; }
.produk .kepala-produk { padding: 18px 16px 4px; }
.produk h1 { margin: 2px 0 8px; font-stretch: 105%; font-weight: 900; font-size: 32px; line-height: 1.02; letter-spacing: -0.02em; }
.produk .harga { font-size: 24px; }
.produk .coret { font-size: 16px; }
.pilih { padding: 22px 16px 6px; }
.pilih-kepala { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.pilih h2 { margin: 0; font-size: 18px; font-weight: 800; }
.grid-size { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
.keterangan-size { margin: 12px 0 0; min-height: 24px; font-weight: 700; color: var(--sedikit-teks); }
details.panduan { margin: 8px 16px 0; border-top: 1px solid rgba(29,27,24,.25); }
details.panduan summary { display: flex; align-items: center; justify-content: space-between; min-height: 52px; font-weight: 700; cursor: pointer; list-style: none; }
details.panduan summary::-webkit-details-marker { display: none; }
details.panduan summary::after { content: "+"; font-size: 24px; font-weight: 500; }
details.panduan[open] summary::after { content: "-"; }
details.panduan .dalam { padding: 0 0 14px; color: var(--redup); }
details.panduan .dalam b { display: block; margin-top: 10px; color: var(--tinta); }
.deskripsi { margin: 20px 16px 0; }
.deskripsi h2 { margin: 0 0 6px; font-size: 18px; }
.ruang-bar { height: 110px; }
.bar-bawah { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--putih); border-top: 1.5px solid var(--tinta); }
.bar-bawah .total { flex: none; line-height: 1.1; }
.bar-bawah .total small { display: block; font-size: 12px; color: var(--redup); }
.bar-bawah .total b { font-size: 18px; }
.bar-bawah .tombol { flex: 1; }

/* ---- Keranjang dan checkout ---- */
.halaman { padding: 8px 16px 40px; }
.halaman h1 { margin: 8px 0 14px; font-stretch: 105%; font-weight: 900; font-size: 32px; letter-spacing: -0.02em; line-height: 1.02; }
.item { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 12px; background: var(--putih); border: 1px solid rgba(29,27,24,.25); border-radius: 2px; margin-bottom: 10px; }
.item .foto { aspect-ratio: 1 / 1; font-size: 11px; padding: 4px; }
.item h2 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.2; }
.item .meta { margin: 2px 0 8px; font-size: 14px; color: var(--redup); }
.item .baris { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--tinta); border-radius: 4px; background: var(--putih); }
.stepper button { width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.stepper button:hover { background: var(--kertas-gelap); }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; }
.hapus { min-height: 44px; padding: 0 6px; border: 0; background: transparent; font-weight: 600; color: var(--redup); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.ringkas { margin: 14px 0 0; padding: 12px 0; border-top: 1.5px solid var(--tinta); display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 18px; }
.ringkas-catatan { margin: 0 0 6px; color: var(--redup); font-size: 15px; }
form { margin-top: 22px; }
.kolom { margin-bottom: 16px; }
.kolom label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 15px; }
.kolom input[type=text], .kolom input[type=tel], .kolom textarea { width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid rgba(29,27,24,.55); border-radius: 4px; background: var(--putih); font-size: 16px; }
.kolom input:focus, .kolom textarea:focus { border-color: var(--tinta); }
.kolom input::placeholder, .kolom textarea::placeholder { color: var(--redup); }
.kolom .bantuan { margin: 4px 0 0; font-size: 13px; color: var(--redup); }
.kolom .galat { margin: 4px 0 0; font-size: 14px; font-weight: 700; color: var(--bata); }
.kolom input[aria-invalid="true"], .kolom textarea[aria-invalid="true"] { border-color: var(--bata); border-width: 2px; }
.kolom label.setuju { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; margin: 0 0 4px; font-weight: 400; }
.setuju input { flex: none; width: 24px; height: 24px; margin: 8px 0 0; accent-color: var(--bata); }
.setuju span { font-size: 15px; padding-top: 4px; }
/* Satu baris di bawah tombol kirim: menjawab ragu bayar ke rekening pribadi (risiko konversi di PRD), tanpa paragraf. */
.belum-bayar { margin: 8px 0 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--redup); }
.ringkasan-galat { margin: 0 0 12px; padding: 10px 12px; border: 1.5px solid var(--bata); border-radius: 2px; color: var(--bata); font-weight: 700; background: var(--putih); }

/* ---- Terkirim ---- */
.kode { margin: 0 0 18px; padding: 16px; border: 1.5px solid var(--tinta); border-radius: 2px; background: var(--putih); }
.kode small { display: block; color: var(--redup); font-weight: 600; }
.kode b { display: block; font-stretch: 75%; font-weight: 800; font-size: 40px; letter-spacing: 0.02em; line-height: 1.05; }
.kode span { display: inline-block; margin-top: 8px; padding: 3px 8px; border: 1.5px solid var(--sedikit-teks); border-radius: 2px; background: var(--sedikit-latar); color: var(--sedikit-teks); font-weight: 700; font-size: 14px; }

/* ---- Lebar layar ---- */
.panel-mockup, .kepala, .cari, .daftar, .toko, .halaman { padding-inline: max(var(--sisi), calc((100% - var(--lebar)) / 2)); }
.halaman.tengah { padding-inline: max(var(--sisi), calc((100% - 640px) / 2)); }
.kepala-kanan { display: flex; align-items: center; gap: 20px; }
.ke-cara-kepala { display: none; min-height: 44px; align-items: center; font-weight: 700; text-underline-offset: 3px; }
.ke-cara-kepala:hover { text-decoration-thickness: 2px; }

@media (min-width: 600px) {
  .ke-cara-kepala { display: inline-flex; }
  .deret-size { grid-template-columns: repeat(8, 1fr); }
  .grid-kartu { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .toko dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 24px; }
}

@media (min-width: 900px) {
  /* Hero: judul kiri, deret size kanan. Satu fokus tetap: pencari size. */
  .cari { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); column-gap: 56px; align-items: end; padding-block: 56px 48px; }
  .cari h1 { font-size: clamp(64px, 7vw, 96px); }
  .cari .sub { margin-bottom: 0; font-size: 18px; }
  .deret-size { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cari .lbl { min-height: 76px; }
  .daftar { padding-top: 48px; }
  .daftar h2 { font-size: 32px; }
  .grid-kartu { grid-template-columns: repeat(4, 1fr); gap: 20px; }
  /* Foto 4:5 di kolom selebar 280px bikin kartu setinggi layar; sepatu dilihat dari samping, jadi persegi cukup. */
  .grid-kartu .foto { aspect-ratio: 1 / 1; }
  .toko { padding-block: 40px 56px; }

  /* Produk: foto menempel di kiri, info dan tombol pesan di kanan. Bar bawah tidak perlu menempel di layar lebar. */
  .produk { padding-inline: max(var(--sisi), calc((100% - var(--lebar)) / 2)); padding-bottom: 56px; }
  .produk .jalan { padding-left: 0; }
  .produk-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 56px; align-items: start; }
  .produk-foto { position: sticky; top: 16px; }
  .produk-info { display: flex; flex-direction: column; }
  .produk .kepala-produk { order: 1; padding: 0; }
  .produk h1 { font-size: 44px; }
  .pilih { order: 2; padding: 24px 0 0; }
  .bar-bawah { order: 3; position: static; padding: 16px 0 0; border: 0; background: none; }
  .bar-bawah .total { display: none; }
  details.panduan { order: 4; margin: 24px 0 0; }
  .deskripsi { order: 5; margin: 20px 0 0; }
  .ruang-bar { display: none; }

  /* Keranjang: isi pesanan kiri, data pengiriman kanan, jadi tombol kirim terlihat tanpa scroll jauh. */
  .halaman h1 { font-size: 44px; }
  .keranjang-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 56px; align-items: start; }
  .keranjang-grid form { margin-top: 0; }
}

.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 20; width: calc(100% - 32px); max-width: 420px; padding: 12px 14px; border-radius: 4px; background: var(--tinta); color: var(--kertas); font-weight: 600; font-size: 15px; }
.toast[hidden] { display: none; }
@media (hover: none) { .tombol:hover, .lbl:hover, .tombol-keranjang:hover { background: revert-layer; } }
</style>
</head>
<body>
<div class="bingkai" id="bingkai">
  <div class="panel-mockup">
    <p><b>Mockup, bukan toko live.</b> Nama model, harga, stok, dan foto di sini contoh. Isian dalam <span class="ph">[kurung]</span> menunggu data dari retailer.</p>
    <nav aria-label="Pindah layar mockup" id="navmock">
      <a href="#/" data-r="beranda">Beranda</a>
      <a href="#/produk/samba-og" data-r="produk">Produk</a>
      <a href="#/keranjang" data-r="keranjang">Keranjang</a>
      <a href="#/terkirim" data-r="terkirim">Pesanan terkirim</a>
      <a href="#/cara-order" data-r="cara">Cara order</a>
    </nav>
  </div>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
/* Data contoh. Stok per size; Ready mulai 3 (sama dengan ambang stok default di admin). */
const AMBANG = 3;
const SIZES = [38, 39, 40, 41, 42, 43, 44, 45];
const PRODUK = [
  { id: "samba-og", brand: "Adidas", nama: "Samba OG", harga: 1399000, coret: 1599000, stok: { 39: 3, 40: 5, 41: 0, 42: 4, 43: 2, 44: 0 } },
  { id: "air-max-90", brand: "Nike", nama: "Air Max 90", harga: 1899000, coret: null, stok: { 40: 2, 41: 3, 42: 6, 43: 4, 44: 1 } },
  { id: "court-vision-low", brand: "Nike", nama: "Court Vision Low", harga: 899000, coret: 1099000, stok: { 38: 2, 39: 4, 40: 3, 41: 5, 42: 0, 43: 2 } },
  { id: "dunk-low", brand: "Nike", nama: "Dunk Low", harga: 1549000, coret: null, stok: { 39: 1, 40: 0, 41: 2, 42: 3, 43: 3, 44: 2, 45: 1 } },
  { id: "gazelle", brand: "Adidas", nama: "Gazelle", harga: 1299000, coret: null, stok: { 38: 3, 39: 2, 40: 4, 41: 3, 42: 2, 43: 0 } },
  { id: "campus-00s", brand: "Adidas", nama: "Campus 00s", harga: 1199000, coret: 1399000, stok: { 39: 0, 40: 2, 41: 3, 42: 5, 43: 3, 44: 2 } },
];
const rp = (n) => "Rp " + n.toLocaleString("id-ID");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stokDi = (p, s) => p.stok[s] || 0;
const status = (n) => (n <= 0 ? "habis" : n >= AMBANG ? "ready" : "sisa");
const teksStatus = (n) => (n <= 0 ? "Habis" : n >= AMBANG ? "Ready" : "Sisa " + n);
const cariProduk = (id) => PRODUK.find((p) => p.id === id);

const state = { brand: "Semua", sizeCari: null, sizePilih: null, produkId: null, keranjang: [], pesanan: null, galat: {} };

const IK = {
  keranjang: '<svg class="ik" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h3l2 11h11l2-8H7"/><path d="M9 20h2M16 20h2"/></svg>',
  kembali: '<svg class="ik" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>',
  tambah: '<svg class="ik" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>',
  kurang: '<svg class="ik" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/></svg>',
  wa: '<svg class="ik" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v12H11l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/></svg>',
};

/* ---- Potongan UI ---- */
function kepala() {
  const n = state.keranjang.reduce((a, i) => a + i.jumlah, 0);
  return `<header class="kepala">
    <a class="merek" href="#/" aria-label="Argashoes, ke katalog">Argashoes</a>
    <div class="kepala-kanan">
      <a class="ke-cara-kepala" href="#/cara-order">Cara order</a>
      <a class="tombol-keranjang" href="#/keranjang" aria-label="Keranjang, ${n} pasang">${IK.keranjang}<span class="teks" aria-hidden="true">Keranjang</span><span class="jumlah angka" aria-hidden="true">${n}</span></a>
    </div>
  </header>`;
}
const foto = (teks = "[FOTO PRODUK]") => `<div class="foto" role="img" aria-label="Foto produk belum ada, ini penanda tempat">${teks}</div>`;

function kartu(p) {
  const ada = SIZES.filter((s) => stokDi(p, s) > 0);
  let info;
  if (state.sizeCari) {
    const n = stokDi(p, state.sizeCari);
    info = `<p class="status-size ${status(n) === "sisa" ? "sisa" : ""}">Size ${state.sizeCari}: ${teksStatus(n)}</p>`;
  } else {
    const tampil = ada.slice(0, 4);
    // Size yang sisa sedikit juga ditulis, bukan cuma diwarnai (DESIGN.md: status stok tidak pernah hanya warna).
    const sisa = tampil.filter((s) => status(stokDi(p, s)) === "sisa");
    info = `<ul class="stok-baris" aria-label="Size yang ada">${tampil
      .map((s) => `<li class="${status(stokDi(p, s)) === "sisa" ? "sisa" : ""}">${s}</li>`)
      .join("")}${ada.length > tampil.length ? `<li class="lebih">+${ada.length - tampil.length}</li>` : ""}</ul>${
      sisa.length ? `<p class="sisa-catatan">Sisa sedikit: ${sisa.join(", ")}</p>` : ""
    }`;
  }
  return `<a class="kartu" href="#/produk/${p.id}" data-aksi="buka" data-id="${p.id}">
    ${foto()}
    <div class="isi">
      <p class="merek-kecil">${p.brand}</p>
      <h3>${p.nama}</h3>
      <p class="harga angka">${rp(p.harga)}${p.coret ? `<span class="coret">${rp(p.coret)}</span>` : ""}</p>
      ${info}
    </div>
  </a>`;
}

function kaki() {
  return `<footer class="toko" aria-labelledby="judul-toko">
    <h2 id="judul-toko">Siapa yang menjual</h2>
    <dl>
      <div><dt>Toko</dt><dd><span class="ph">[NAMA TOKO]</span></dd></div>
      <div><dt>Alamat</dt><dd><span class="ph">[ALAMAT TOKO]</span></dd></div>
      <div><dt>Retur</dt><dd><span class="ph">[KEBIJAKAN RETUR]</span></dd></div>
    </dl>
    <a class="ke-cara" href="#/cara-order">Cara order</a>
  </footer>`;
}

/* ---- Layar ---- */
function layarBeranda() {
  let daftar = PRODUK.filter((p) => state.brand === "Semua" || p.brand === state.brand);
  if (state.sizeCari) daftar = daftar.filter((p) => stokDi(p, state.sizeCari) > 0);
  // Urut dari stok terbanyak di size yang dicari, supaya yang paling aman dipesan tampil dulu.
  if (state.sizeCari) daftar.sort((a, b) => stokDi(b, state.sizeCari) - stokDi(a, state.sizeCari));

  // Hasil pilih size ada di bawah layar HP, jadi hasilnya jadi tombol yang membawa ke daftar.
  const hasil = !state.sizeCari
    ? ""
    : daftar.length
      ? `<a class="lihat-hasil" href="#judul-daftar" data-aksi="ke-daftar">Lihat ${daftar.length} model di size ${state.sizeCari}</a>`
      : `<p class="hasil">Size ${state.sizeCari} belum ada yang ready.</p>`;

  let isiDaftar;
  if (daftar.length === 0) {
    isiDaftar = `<div class="kosong">${
      state.sizeCari
        ? `<p>Belum ada ${state.brand === "Semua" ? "model" : state.brand} size ${state.sizeCari} yang ready.</p><button class="tombol" type="button" data-aksi="semua-model">Lihat semua model</button>`
        : "<p>Belum ada model di merek ini.</p>"
    }</div>`;
  } else {
    isiDaftar = `<ul class="grid-kartu">${daftar.map((p) => `<li>${kartu(p)}</li>`).join("")}</ul>`;
  }

  return `${kepala()}
  <main>
    <section class="cari gelap" aria-labelledby="judul-cari">
      <div class="cari-teks">
        <h1 id="judul-cari">Cari size kamu.</h1>
        <p class="sub">Pilih size, kami tampilkan model Nike dan Adidas yang masih ada stoknya.</p>
      </div>
      <div class="cari-size">
      <ul class="deret-size" aria-label="Pilih size">
        ${SIZES.map((s) => `<li><button class="lbl" type="button" data-aksi="cari-size" data-size="${s}" aria-pressed="${state.sizeCari === s}"><span class="no angka">${s}</span></button></li>`).join("")}
      </ul>
      <div role="status" aria-live="polite">${hasil}</div>
      </div>
    </section>

    <section class="daftar" aria-labelledby="judul-daftar">
      <div class="daftar-kepala">
        <h2 id="judul-daftar" tabindex="-1">${state.sizeCari ? `Ready di size ${state.sizeCari}` : "Semua model"}</h2>
        <div class="merek-pilih" role="group" aria-label="Filter merek">
          ${["Semua", "Nike", "Adidas"].map((m) => `<button type="button" data-aksi="merek" data-merek="${m}" aria-pressed="${state.brand === m}">${m}</button>`).join("")}
        </div>
      </div>
      ${isiDaftar}
    </section>
  </main>
  ${kaki()}`;
}

function layarCaraOrder() {
  return `${kepala()}
  <main class="halaman tengah">
    <a class="jalan" style="padding-left:0" href="#/">${IK.kembali}Katalog</a>
    <h1>Cara order</h1>
    <ol class="langkah">
      <li><span class="no" aria-hidden="true">1</span><div><b>Pilih size, isi data pengiriman</b><span>Tanpa akun. Cukup nama, nomor WhatsApp, dan alamat.</span></div></li>
      <li><span class="no" aria-hidden="true">2</span><div><b>Pesanan tercatat dengan kode</b><span>Sebut kode ini saat chat dengan toko.</span></div></li>
      <li><span class="no" aria-hidden="true">3</span><div><b>Toko membalas di WhatsApp</b><span>Cek stok dan hitung ongkir ke alamatmu.</span></div></li>
      <li><span class="no" aria-hidden="true">4</span><div><b>Kamu bayar, toko mengirim</b><span>Nomor resi dikirim lewat WhatsApp.</span></div></li>
    </ol>
  </main>
  ${kaki()}`;
}

function layarProduk(id) {
  const p = cariProduk(id) || PRODUK[0];
  if (state.produkId !== p.id) {
    state.produkId = p.id;
    // Kalau pembeli sudah memilih size di beranda dan size itu ada, langsung terpilih.
    state.sizePilih = state.sizeCari && stokDi(p, state.sizeCari) > 0 ? state.sizeCari : null;
  }
  const s = state.sizePilih;
  const n = s ? stokDi(p, s) : null;
  const habisDipilih = s !== null && n === 0;
  const sizes = SIZES.filter((x) => x in p.stok);
  // Label size sudah menulis Ready/Habis. Yang perlu ditulis lagi cuma sisa sedikit; sisanya hanya untuk pembaca layar.
  const ket = s === null
    ? `<span class="sr">Belum ada size dipilih.</span>`
    : n === 0
      ? `<span class="sr">Size ${s} habis.</span>`
      : n >= AMBANG
        ? `<span class="sr">Size ${s} dipilih, ready.</span>`
        : `Tinggal ${n} pasang.`;
  const label = s === null ? "Pilih size dulu" : habisDipilih ? "Size ini habis" : `Pesan size ${s}`;
  const mati = s === null || habisDipilih;

  return `${kepala()}
  <main class="produk">
    <a class="jalan" href="#/">${IK.kembali}Katalog</a>
    <div class="produk-grid">
    <div class="produk-foto">${foto("[FOTO PRODUK]")}</div>
    <div class="produk-info">
    <div class="kepala-produk">
      <p class="merek-kecil">${p.brand}</p>
      <h1>${p.nama}</h1>
      <p class="harga angka">${rp(p.harga)}${p.coret ? `<span class="coret">${rp(p.coret)}</span>` : ""}</p>
    </div>

    <section class="pilih" aria-labelledby="judul-size">
      <div class="pilih-kepala"><h2 id="judul-size">Pilih size</h2></div>
      <ul class="grid-size">
        ${sizes.map((x) => { const st = status(stokDi(p, x)); const dipilih = s === x; return `<li><button class="lbl ${st}" type="button" data-aksi="pilih-size" data-size="${x}" aria-pressed="${dipilih}" aria-label="Size ${x}, ${teksStatus(stokDi(p, x))}"><span class="no angka">${x}</span><span class="st">${dipilih ? "Dipilih" : teksStatus(stokDi(p, x))}</span></button></li>`; }).join("")}
      </ul>
      <p class="keterangan-size" role="status" aria-live="polite">${ket}</p>
    </section>

    <details class="panduan">
      <summary>Panduan size dan retur</summary>
      <div class="dalam"><span class="ph">[TABEL SIZE DARI TOKO]</span><b>Retur</b><span class="ph">[KEBIJAKAN RETUR]</span></div>
    </details>

    <section class="deskripsi">
      <h2>Tentang model ini</h2>
      <span class="ph">[DESKRIPSI PRODUK]</span>
    </section>
    <div class="ruang-bar" aria-hidden="true"></div>
    <div class="bar-bawah">
      <div class="total"><small>Harga</small><b class="angka">${rp(p.harga)}</b></div>
      <button class="tombol utama" type="button" data-aksi="pesan" ${mati ? "disabled" : ""}>${label}</button>
    </div>
    </div>
    </div>
  </main>`;
}

function layarKeranjang() {
  const k = state.keranjang;
  const total = k.reduce((a, i) => a + cariProduk(i.id).harga * i.jumlah, 0);
  const g = state.galat;
  const jumlahGalat = Object.keys(g).length;
  if (k.length === 0) {
    return `${kepala()}<main class="halaman"><a class="jalan" style="padding-left:0" href="#/">${IK.kembali}Katalog</a>
      <h1>Keranjang</h1>
      <div class="kosong"><p>Keranjang masih kosong.</p><a class="tombol utama" href="#/">Cari size di katalog</a></div></main>`;
  }
  const kolom = (id, label, input, bantuan) => `<div class="kolom"><label for="${id}">${label}</label>${input}${bantuan && !g[id] ? `<p class="bantuan" id="${id}-b">${bantuan}</p>` : ""}${g[id] ? `<p class="galat" id="${id}-e">${g[id]}</p>` : ""}</div>`;
  const attr = (id, bantuan) => `aria-invalid="${Boolean(g[id])}"${g[id] ? ` aria-describedby="${id}-e"` : bantuan ? ` aria-describedby="${id}-b"` : ""}`;
  return `${kepala()}
  <main class="halaman">
    <a class="jalan" style="padding-left:0" href="#/">${IK.kembali}Tambah model lain</a>
    <h1>Keranjang</h1>
    <div class="keranjang-grid">
    <div class="keranjang-isi">
    ${k.map((i, idx) => { const p = cariProduk(i.id); return `<article class="item">
      ${foto("[FOTO]")}
      <div>
        <h2>${p.brand} ${p.nama}</h2>
        <p class="meta angka">Size ${i.size} · ${rp(p.harga)}</p>
        <div class="baris">
          <div class="stepper" role="group" aria-label="Jumlah pasang">
            <button type="button" data-aksi="kurang" data-i="${idx}" aria-label="Kurangi satu pasang">${IK.kurang}</button>
            <output class="angka" aria-live="polite">${i.jumlah}</output>
            <button type="button" data-aksi="tambah" data-i="${idx}" aria-label="Tambah satu pasang">${IK.tambah}</button>
          </div>
          <button class="hapus" type="button" data-aksi="hapus" data-i="${idx}">Hapus</button>
        </div>
      </div></article>`; }).join("")}
    <div class="ringkas"><span>Subtotal</span><span class="angka">${rp(total)}</span></div>
    <p class="ringkas-catatan">Belum termasuk ongkir.</p>
    </div>

    <form id="form-pesan" novalidate>
      <h2 style="margin:0 0 12px;font-size:22px;font-weight:800">Data pengiriman</h2>
      ${kolom("nama", "Nama penerima", `<input id="nama" name="nama" type="text" autocomplete="name" ${attr("nama")}>`, "")}
      ${kolom("wa", "Nomor WhatsApp", `<input id="wa" name="wa" type="tel" inputmode="tel" autocomplete="tel" ${attr("wa")}>`, "")}
      ${kolom("alamat", "Alamat lengkap", `<textarea id="alamat" name="alamat" rows="3" autocomplete="street-address" ${attr("alamat", true)}></textarea>`, "Jalan, nomor, kecamatan, kota, kode pos.")}
      ${kolom("catatan", "Catatan untuk toko (opsional)", `<textarea id="catatan" name="catatan" rows="2"></textarea>`, "")}
      <div class="kolom">
        <label class="setuju"><input type="checkbox" id="setuju" name="setuju" aria-invalid="${Boolean(g.setuju)}" ${g.setuju ? 'aria-describedby="setuju-e"' : ""}><span>Saya setuju data ini dipakai toko untuk pesanan ini. <span class="ph">[LINK KEBIJAKAN PRIVASI]</span></span></label>
        ${g.setuju ? `<p class="galat" id="setuju-e">${g.setuju}</p>` : ""}
      </div>
      ${jumlahGalat ? `<p class="ringkasan-galat" role="alert">Ada ${jumlahGalat} isian yang perlu dibetulkan.</p>` : ""}
      <button class="tombol utama penuh" type="submit">${IK.wa}Kirim pesanan ke WhatsApp</button>
      <p class="belum-bayar">Belum bayar. Stok dan ongkir dicek dulu di WhatsApp.</p>
    </form>
    </div>
  </main>`;
}

function layarTerkirim() {
  const sampel = !state.pesanan;
  const o = state.pesanan || { nama: "[NAMA PEMBELI]", item: [{ id: "samba-og", size: 42, jumlah: 1 }], total: cariProduk("samba-og").harga };
  return `${kepala()}
  <main class="halaman tengah">
    <h1>Pesananmu sudah tercatat</h1>
    ${sampel ? `<p class="ringkas-catatan"><span class="ph">[CONTOH]</span> Begini tampilan setelah pesanan dikirim.</p>` : ""}
    <p class="kode"><small>Kode pesanan</small><b class="angka">WEB-xxxx</b><span>Menunggu balasan toko</span></p>
    <div style="margin-bottom:22px">
      ${o.item.map((i) => { const p = cariProduk(i.id); return `<p style="margin:0 0 4px" class="angka">${i.jumlah} × ${p.brand} ${p.nama}, size ${i.size}</p>`; }).join("")}
      <p style="margin:8px 0 0;font-weight:800" class="angka">Subtotal ${rp(o.total)} <span style="font-weight:400;color:var(--redup)">(belum termasuk ongkir)</span></p>
    </div>
    <div style="display:grid;gap:10px">
      <button class="tombol utama penuh" type="button" data-aksi="buka-wa">${IK.wa}Buka WhatsApp</button>
      <a class="tombol penuh" href="#/">Cari model lain</a>
    </div>
  </main>`;
}

/* ---- Router dan aksi ---- */
const app = document.getElementById("app");
const toast = document.getElementById("toast");
let timerToast;
function beri(teks) {
  toast.textContent = teks;
  toast.hidden = false;
  clearTimeout(timerToast);
  timerToast = setTimeout(() => (toast.hidden = true), 4200);
}
function aktifkanNav(nama) {
  document.querySelectorAll("#navmock a").forEach((a) => (a.dataset.r === nama ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
}
function gambar() {
  const h = location.hash.replace(/^#/, "") || "/";
  const [, rute, arg] = h.split("/");
  if (rute === "produk") { app.innerHTML = layarProduk(arg); aktifkanNav("produk"); document.title = (cariProduk(arg) || PRODUK[0]).nama + " · Argashoes"; }
  else if (rute === "keranjang") { app.innerHTML = layarKeranjang(); aktifkanNav("keranjang"); document.title = "Keranjang · Argashoes"; }
  else if (rute === "cara-order") { app.innerHTML = layarCaraOrder(); aktifkanNav("cara"); document.title = "Cara order · Argashoes"; }
  else if (rute === "terkirim") { app.innerHTML = layarTerkirim(); aktifkanNav("terkirim"); document.title = "Pesanan tercatat · Argashoes"; }
  else { app.innerHTML = layarBeranda(); aktifkanNav("beranda"); document.title = "Argashoes · cari size, pesan lewat WhatsApp"; }
}
let fokusSetelah = null;
function pasang(fokus) { fokusSetelah = fokus || null; gambar(); if (fokusSetelah) { const el = document.querySelector(fokusSetelah); if (el) el.focus(); } }

window.addEventListener("hashchange", () => { state.galat = {}; gambar(); window.scrollTo(0, 0); });

app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-aksi]");
  if (!t) return;
  const a = t.dataset.aksi;
  if (a === "cari-size") {
    const s = Number(t.dataset.size);
    state.sizeCari = state.sizeCari === s ? null : s;
    pasang(`[data-aksi="cari-size"][data-size="${s}"]`);
  } else if (a === "merek") {
    state.brand = t.dataset.merek;
    pasang(`[data-aksi="merek"][data-merek="${state.brand}"]`);
  } else if (a === "pilih-size") {
    const s = Number(t.dataset.size);
    state.sizePilih = state.sizePilih === s ? null : s;
    pasang(`[data-aksi="pilih-size"][data-size="${s}"]`);
  } else if (a === "pesan") {
    const id = state.produkId, size = state.sizePilih;
    const ada = state.keranjang.find((i) => i.id === id && i.size === size);
    if (ada) ada.jumlah += 1; else state.keranjang.push({ id, size, jumlah: 1 });
    location.hash = "#/keranjang";
  } else if (a === "tambah" || a === "kurang") {
    const i = state.keranjang[Number(t.dataset.i)];
    i.jumlah = Math.max(1, Math.min(5, i.jumlah + (a === "tambah" ? 1 : -1)));
    pasang(`[data-aksi="${a}"][data-i="${t.dataset.i}"]`);
  } else if (a === "hapus") {
    state.keranjang.splice(Number(t.dataset.i), 1);
    pasang();
  } else if (a === "ke-daftar") {
    e.preventDefault();
    const judul = document.getElementById("judul-daftar");
    judul.scrollIntoView({ block: "start" });
    judul.focus({ preventScroll: true });
  } else if (a === "semua-model") {
    state.sizeCari = null;
    state.brand = "Semua";
    pasang("#judul-daftar");
  } else if (a === "buka-wa") {
    beri("Mockup: di web asli tombol ini membuka WhatsApp toko dengan kode pesanan sudah terisi.");
  }
});

app.addEventListener("submit", (e) => {
  if (e.target.id !== "form-pesan") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const g = {};
  const wa = String(f.get("wa") || "").replace(/[\s\-().+]/g, "");
  if (!String(f.get("nama") || "").trim()) g.nama = "Nama penerima wajib diisi.";
  if (!/^(0|62)8\d{7,12}$/.test(wa)) g.wa = "Isi nomor WhatsApp Indonesia, contoh 0812 3456 7890.";
  if (String(f.get("alamat") || "").trim().length < 15) g.alamat = "Alamat terlalu pendek. Tulis jalan, kecamatan, kota, dan kode pos.";
  if (!f.get("setuju")) g.setuju = "Centang persetujuan supaya toko boleh memproses pesananmu.";
  if (Object.keys(g).length) {
    // Isian yang sudah benar dipertahankan lewat penyimpanan sementara di state.
    state.galat = g; state.isi = { nama: f.get("nama"), wa: f.get("wa"), alamat: f.get("alamat"), catatan: f.get("catatan") };
    gambar();
    for (const [k, v] of Object.entries(state.isi)) { const el = document.getElementById(k); if (el) el.value = v || ""; }
    // Fokus ke kolom pertama yang salah: di HP pembeli sedang di bawah form saat menekan kirim.
    document.getElementById(Object.keys(g)[0])?.focus();
    return;
  }
  const total = state.keranjang.reduce((a, i) => a + cariProduk(i.id).harga * i.jumlah, 0);
  state.pesanan = { nama: String(f.get("nama")).trim(), item: state.keranjang.map((i) => ({ ...i })), total };
  state.keranjang = []; state.galat = {}; state.isi = null;
  location.hash = "#/terkirim";
});

gambar();
</script>
